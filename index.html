<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://badge-beadgrid.litomore.me/" />
    <script>
      try {
        const preference = localStorage.getItem("badge-beadgrid-theme");
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#1f1b19" : "#f7f2e8";
      } catch {}
    </script>
    <meta name="description" content="Turn any Shields.io badge into a colorful, downloadable fuse bead pattern." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Badge Beadgrid" />
    <meta property="og:title" content="Badge Beadgrid — Badges, made bead by bead" />
    <meta property="og:description" content="Paste a Shields.io badge URL and turn it into a ready-to-make fuse bead pattern." />
    <meta property="og:url" content="https://badge-beadgrid.litomore.me/" />
    <meta property="og:image" content="https://badge-beadgrid.litomore.me/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Badge Beadgrid turns Shields.io badges into colorful fuse bead patterns." />

    <meta name="twitter:title" content="Badge Beadgrid — Badges, made bead by bead" />
    <meta name="twitter:description" content="Turn any Shields.io badge into a colorful, ready-to-make fuse bead pattern." />
    <meta name="twitter:image" content="https://badge-beadgrid.litomore.me/og.png" />
    <meta name="twitter:image:alt" content="Badge Beadgrid turns Shields.io badges into colorful fuse bead patterns." />
    <title>Badge Beadgrid — Badges, made bead by bead</title>
  </head>

  </body>
</html>
